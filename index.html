<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>S7INIX — Admin Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/tsparticles-slim@2.12.0/tsparticles.slim.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/crypto-js@4.2.0/crypto-js.min.js"></script>
<style>
  /* ===== Animated Angle (للإطار الدوار) ===== */
  @property --angle {
    syntax: '<angle>';
    initial-value: 0deg;
    inherits: false;
  }

  @keyframes rotateAngle {
    to { --angle: 360deg; }
  }
  :root{
    --white:#ffffff;
    --bg-soft:#F5F8FF;
    --navy:#0F2557;
    --blue:#3B82F6;
    --blue-light:#60A5FA;
    --text:#0B1B3B;
    --text-soft:#5A6B8C;
    --border:#D6E4FF;
    --success:#10B981;
    --danger:#EF4444;
    --shadow:0 20px 60px rgba(15,37,87,.12);
    --radius:20px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:'Cairo',system-ui,-apple-system,sans-serif;
    background:linear-gradient(135deg,#ffffff 0%,#EEF4FF 100%);
    color:var(--text);
    overflow:hidden;
    position:relative;
  }

  /* ===== Custom Scrollbar ===== */
  .scroll-area::-webkit-scrollbar{width:8px}
  .scroll-area::-webkit-scrollbar-track{background:transparent}
  .scroll-area::-webkit-scrollbar-thumb{
    background:linear-gradient(180deg,var(--blue),var(--blue-light));
    border-radius:10px;
    border:2px solid transparent;
    background-clip:padding-box;
  }
  .scroll-area::-webkit-scrollbar-thumb:hover{background:var(--navy);background-clip:padding-box}
  .scroll-area{scrollbar-width:thin;scrollbar-color:var(--blue) transparent}

  /* ===== Background Particles ===== */
  #tsparticles{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
  }

  /* ===== Auth Screen (scrollable) ===== */
  .auth-screen{
    position:fixed;
    inset:0;
    z-index:2;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    overflow-y:auto;
    overflow-x:hidden;
    transition:opacity .5s ease, transform .5s ease;
    -webkit-overflow-scrolling:touch;
  }
  .auth-screen.hidden{
    opacity:0;
    transform:scale(.96);
    pointer-events:none;
  }

  .auth-card{
    width:100%;
    max-width:440px;
    background:rgba(255,255,255,.85);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:36px 32px 30px;
    animation:cardIn .7s cubic-bezier(.2,.8,.2,1) both;
    position:relative;
    overflow:hidden;
    margin:auto; /* يوسّط الكارد ويسيب سكرول لو الشاشة قصيرة */
    flex-shrink:0;
  }
  .auth-card::before{
    content:"";
    position:absolute;
    top:-60px;right:-60px;
    width:160px;height:160px;
    border-radius:50%;
    background:radial-gradient(circle,rgba(59,130,246,.18),transparent 70%);
    pointer-events:none;
  }
  @keyframes cardIn{
    from{opacity:0;transform:translateY(24px) scale(.98)}
    to{opacity:1;transform:translateY(0) scale(1)}
  }

  .brand{
    text-align:center;
    margin-bottom:22px;
  }
  .brand-logo{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:64px;height:64px;
    border-radius:18px;
    background:linear-gradient(135deg,var(--navy),var(--blue));
    color:#fff;
    font-weight:900;
    font-size:24px;
    letter-spacing:1px;
    box-shadow:0 12px 28px rgba(59,130,246,.35);
    margin-bottom:12px;
    animation:float 3.5s ease-in-out infinite;
  }
  @keyframes float{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-6px)}
  }
  .brand h1{
    font-size:22px;
    color:var(--navy);
    font-weight:900;
  }
  .brand p{
    font-size:13px;
    color:var(--text-soft);
    margin-top:4px;
    font-weight:600;
  }

  .tabs{
    display:flex;
    background:var(--bg-soft);
    border-radius:14px;
    padding:5px;
    margin-bottom:22px;
    position:relative;
    border:1px solid var(--border);
  }
  .tab-btn{
    flex:1;
    border:none;
    background:transparent;
    padding:10px 0;
    font-family:inherit;
    font-weight:700;
    font-size:14px;
    color:var(--text-soft);
    cursor:pointer;
    border-radius:10px;
    transition:all .3s ease;
    position:relative;
    z-index:1;
  }
  .tab-btn.active{
    color:#fff;
    background:linear-gradient(135deg,var(--navy),var(--blue));
    box-shadow:0 8px 20px rgba(59,130,246,.3);
  }

  .form-group{
    margin-bottom:16px;
    animation:fadeUp .5s ease both;
  }
  .form-group:nth-child(2){animation-delay:.05s}
  .form-group:nth-child(3){animation-delay:.1s}
  .form-group:nth-child(4){animation-delay:.15s}
  @keyframes fadeUp{
    from{opacity:0;transform:translateY(10px)}
    to{opacity:1;transform:translateY(0)}
  }
  .form-group label{
    display:block;
    font-size:13px;
    font-weight:700;
    color:var(--navy);
    margin-bottom:8px;
  }
  .form-group input{
    width:100%;
    padding:13px 16px;
    border:1.5px solid var(--border);
    border-radius:12px;
    font-family:inherit;
    font-size:14px;
    color:var(--text);
    background:#fff;
    transition:border-color .25s ease, box-shadow .25s ease;
    outline:none;
  }
  .form-group input:focus{
    border-color:var(--blue);
    box-shadow:0 0 0 4px rgba(59,130,246,.12);
  }
  .form-group input::placeholder{color:#A8B4CC}

  .btn-primary{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    font-family:inherit;
    font-weight:800;
    font-size:15px;
    color:#fff;
    background:linear-gradient(135deg,var(--navy),var(--blue));
    cursor:pointer;
    margin-top:6px;
    position:relative;
    overflow:hidden;
    transition:transform .2s ease, box-shadow .3s ease, opacity .2s ease;
    box-shadow:0 10px 24px rgba(59,130,246,.32);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    min-height:50px;
  }
  .btn-primary:hover:not(:disabled){
    transform:translateY(-2px);
    box-shadow:0 14px 30px rgba(59,130,246,.42);
  }
  .btn-primary:active:not(:disabled){transform:translateY(0)}
  .btn-primary:disabled{
    opacity:.7;
    cursor:not-allowed;
    transform:none;
  }
  .btn-primary .spinner{
    width:18px;height:18px;
    border:2.5px solid rgba(255,255,255,.35);
    border-top-color:#fff;
    border-radius:50%;
    animation:spin .7s linear infinite;
    display:none;
  }
  .btn-primary.loading .spinner{display:inline-block}
  .btn-primary.loading .btn-text{opacity:.85}
  @keyframes spin{to{transform:rotate(360deg)}}

  .error-msg{
    font-size:13px;
    color:var(--danger);
    text-align:center;
    margin-top:12px;
    min-height:18px;
    font-weight:600;
    opacity:0;
    transition:opacity .3s ease;
  }
  .error-msg.show{opacity:1}

  /* ===== Dashboard (Empty) ===== */
  .dashboard{
    position:fixed;
    inset:0;
    z-index:1;
    background:transparent;
    opacity:0;
    pointer-events:none;
    transition:opacity .5s ease;
    overflow-y:auto;
  }
  .dashboard.visible{
    opacity:1;
    pointer-events:auto;
    z-index:3;
  }
  .logout-btn{
    width:100%;
    padding:12px 18px;
    border-radius:12px;
    border:1.5px solid var(--border);
    background:rgba(255,255,255,.7);
    font-family:inherit;
    font-weight:700;
    font-size:13px;
    color:var(--navy);
    cursor:pointer;
    transition:all .25s ease;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
  }
  .logout-btn:hover{
    background:#fff;
    border-color:var(--blue);
    color:var(--blue);
    transform:translateY(-1px);
    box-shadow:0 8px 20px rgba(59,130,246,.2);
  }
    /* ===== Menu Button (Hamburger) ===== */
  .menu-btn{
    position:fixed;
    top:20px;
    left:20px;
    z-index:20;
    width:46px;
    height:46px;
    border-radius:12px;
    border:1.5px solid var(--border);
    background:rgba(255,255,255,.75);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:5px;
    transition:background .25s ease, border-color .25s ease, box-shadow .25s ease;
  }
  .menu-btn:hover{
    background:#fff;
    border-color:var(--blue);
    box-shadow:0 8px 20px rgba(59,130,246,.2);
  }
  .menu-btn span{
    display:block;
    width:20px;
    height:2.5px;
    background:var(--navy);
    border-radius:2px;
    transition:transform .35s cubic-bezier(.68,-0.55,.27,1.55), opacity .25s ease, background .25s ease;
  }
  .menu-btn:hover span{background:var(--blue)}
  /* يتحول X لما القائمة تفتح */
  .menu-btn.active span:nth-child(1){transform:translateY(7.5px) rotate(45deg)}
  .menu-btn.active span:nth-child(2){opacity:0;transform:scaleX(0)}
  .menu-btn.active span:nth-child(3){transform:translateY(-7.5px) rotate(-45deg)}
  /* ===== Top Logo (Right) ===== */
  .top-logo{
    position:fixed;
    top:20px;
    right:20px;
    z-index:20;
    width:46px;
    height:46px;
    border-radius:12px;
    background:rgba(255,255,255,.75);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border:1.5px solid var(--border);
    padding:4px;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 4px 14px rgba(15,37,87,.08);
    transition:transform .25s ease, box-shadow .25s ease, border-color .25s ease;
  }
  .top-logo:hover{
    border-color:var(--blue);
    transform:translateY(-1px);
    box-shadow:0 8px 20px rgba(59,130,246,.2);
  }
  .top-logo img{
    width:100%;
    height:100%;
    object-fit:contain;
    border-radius:8px;
    display:block;
  }
    /* ===== Liquid Glass Rotating Light (Menu + Logo) ===== */
  .menu-btn::before,
  .top-logo::before{
    content:"";
    position:absolute;
    inset:-2px;
    border-radius:14px;
    padding:2px;
    background:conic-gradient(
      from var(--angle),
      transparent 0deg,
      transparent 300deg,
      rgba(168,85,247,.7) 335deg,
      rgba(192,132,252,1) 350deg,
      rgba(168,85,247,.7) 358deg,
      transparent 360deg
    );
    -webkit-mask:
      linear-gradient(#000 0 0) content-box,
      linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
    mask:
      linear-gradient(#000 0 0) content-box,
      linear-gradient(#000 0 0);
    mask-composite:exclude;
    animation:rotateAngle 3s linear infinite;
    pointer-events:none;
    z-index:1;
  }

  .menu-btn::after,
  .top-logo::after{
    content:"";
    position:absolute;
    inset:-3px;
    border-radius:15px;
    background:conic-gradient(
      from var(--angle),
      transparent 0deg,
      transparent 300deg,
      rgba(168,85,247,.4) 335deg,
      rgba(192,132,252,.75) 350deg,
      rgba(168,85,247,.4) 358deg,
      transparent 360deg
    );
    filter:blur(6px);
    animation:rotateAngle 3s linear infinite;
    pointer-events:none;
    z-index:-1;
  }
  /* ===== Sidebar Overlay ===== */
  .sidebar-overlay{
    position:fixed;
    inset:0;
    background:rgba(15,37,87,.35);
    backdrop-filter:blur(4px);
    -webkit-backdrop-filter:blur(4px);
    z-index:25;
    opacity:0;
    pointer-events:none;
    transition:opacity .35s ease;
  }
  .sidebar-overlay.active{
    opacity:1;
    pointer-events:auto;
  }

  /* ===== Sidebar ===== */
  .sidebar{
    position:fixed;
    top:0;
    left:0;
    height:100%;
    width:280px;
    max-width:85vw;
    background:#fff;
    border-right:1px solid var(--border);
    box-shadow:4px 0 30px rgba(15,37,87,.12);
    z-index:30;
    transform:translateX(-100%);
    transition:transform .4s cubic-bezier(.2,.8,.2,1);
    display:flex;
    flex-direction:column;
  }
  .sidebar.active{
    transform:translateX(0);
  }
  .sidebar-header{
    display:flex;
    align-items:center;
    gap:12px;
    padding:22px 20px;
    border-bottom:1px solid var(--border);
  }
  .sidebar-logo{
    width:46px;
    height:46px;
    border-radius:14px;
    background:linear-gradient(135deg,var(--navy),var(--blue));
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:900;
    font-size:16px;
    box-shadow:0 8px 20px rgba(59,130,246,.3);
    flex-shrink:0;
  }
  .sidebar-title strong{
    display:block;
    font-size:16px;
    color:var(--navy);
    font-weight:900;
    line-height:1.2;
  }
  .sidebar-title small{
    font-size:12px;
    color:var(--text-soft);
    font-weight:600;
  }
  .sidebar-nav{
    flex:1;
    overflow-y:auto;
    padding:16px 12px;
  }
    .nav-item{
    width:100%;
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 14px;
    border:none;
    background:transparent;
    border-radius:12px;
    font-family:inherit;
    font-weight:700;
    font-size:14px;
    color:var(--text-soft);
    cursor:pointer;
    transition:background .2s ease, color .2s ease, transform .15s ease;
    text-align:right;
  }
  .nav-item svg{flex-shrink:0;transition:color .2s ease}
  .nav-item:hover{
    background:var(--bg-soft);
    color:var(--navy);
  }
  .nav-item:hover svg{color:var(--blue)}
  .nav-item.active{
    background:linear-gradient(135deg,var(--navy),var(--blue));
    color:#fff;
    box-shadow:0 8px 20px rgba(59,130,246,.28);
  }
  .nav-item.active svg{color:#fff}
  .nav-item:active{transform:scale(.98)}
  .sidebar-footer{
    padding:16px 12px;
    border-top:1px solid var(--border);
  }

  /* ===== Boot Loader ===== */
  .boot-loader{
    position:fixed;
    inset:0;
    z-index:99;
    background:linear-gradient(135deg,#ffffff,#EEF4FF);
    display:flex;
    align-items:center;
    justify-content:center;
    transition:opacity .5s ease;
  }
  .boot-loader.hidden{opacity:0;pointer-events:none}
  .boot-loader .ring{
    width:52px;height:52px;
    border:3px solid var(--border);
    border-top-color:var(--blue);
    border-radius:50%;
    animation:spin .8s linear infinite;
  }

  /* ===== Responsive ===== */
  @media (max-width:480px){
    .auth-screen{padding:16px}
    .auth-card{padding:28px 20px 24px;border-radius:16px}
    .brand-logo{width:56px;height:56px;font-size:20px;border-radius:16px}
    .brand h1{font-size:19px}
    .brand p{font-size:12px}
    .tab-btn{font-size:13px;padding:9px 0}
    .form-group input{padding:12px 14px;font-size:13.5px}
    .btn-primary{font-size:14px;min-height:48px}
    .logout-btn{top:14px;left:14px;padding:9px 14px;font-size:12px}
  }

  /* شاشات قصيرة الارتفاع → السكرول يشتغل أنيق */
  @media (max-height:720px){
    .auth-screen{align-items:flex-start;padding-top:20px;padding-bottom:20px}
    .auth-card{margin-top:0;margin-bottom:0}
    .brand-logo{width:52px;height:52px;font-size:19px}
    .brand h1{font-size:20px}
    .auth-card{padding:26px 26px 22px}
    .tabs{margin-bottom:16px}
    .form-group{margin-bottom:12px}
  }

  @media (max-height:600px){
    .auth-card{padding:22px 22px 20px}
    .brand{margin-bottom:14px}
    .brand-logo{width:46px;height:46px;font-size:17px;margin-bottom:8px}
    .brand h1{font-size:18px}
    .brand p{font-size:11px}
    .tabs{margin-bottom:12px}
    .form-group{margin-bottom:10px}
    .form-group label{font-size:12px;margin-bottom:6px}
    .form-group input{padding:10px 12px;font-size:13px}
    .btn-primary{min-height:44px;font-size:13.5px;padding:12px}
  }
    @media (max-width:480px){
    .top-logo{
      top:14px;
      right:14px;
      width:42px;
      height:42px;
      border-radius:10px;
    }
    .top-logo::before{border-radius:12px}
    .top-logo::after{border-radius:13px}
  }
    .remember-row{display:flex;align-items:center;margin:2px 0 14px}
  .remember-label{
    display:flex;align-items:center;gap:10px;cursor:pointer;
    font-size:13px;font-weight:600;color:var(--text-soft);user-select:none;
  }
  .remember-label input{
    appearance:none;-webkit-appearance:none;
    width:18px;height:18px;border-radius:6px;
    border:1.5px solid var(--border);background:#fff;
    cursor:pointer;position:relative;transition:all .2s ease;
    flex-shrink:0;
  }
  .remember-label input:checked{
    background:linear-gradient(135deg,var(--navy),var(--blue));
    border-color:var(--blue);
  }
  .remember-label input:checked::after{
    content:"";position:absolute;top:2px;left:5px;
    width:5px;height:9px;border:solid #fff;
    border-width:0 2px 2px 0;transform:rotate(45deg);
  }
  .remember-label input:focus-visible{box-shadow:0 0 0 3px rgba(59,130,246,.2)}

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important;transition:none !important}
  }
    /* ===== Page Transition Overlay ===== */
  .transition-overlay{
    position:fixed;
    inset:0;
    z-index:9999;
    background:linear-gradient(135deg,var(--navy) 0%,var(--blue) 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    pointer-events:none;
    transition:opacity .45s cubic-bezier(.4,0,.2,1);
  }
  .transition-overlay.active{
    opacity:1;
    pointer-events:auto;
  }
  .transition-logo{
    width:80px;
    height:80px;
    border-radius:22px;
    background:rgba(255,255,255,.15);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border:1.5px solid rgba(255,255,255,.3);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:900;
    font-size:28px;
    letter-spacing:1px;
    transform:scale(.5);
    opacity:0;
    transition:transform .5s cubic-bezier(.2,.8,.2,1), opacity .4s ease;
  }
  .transition-overlay.active .transition-logo{
    transform:scale(1);
    opacity:1;
    animation:float 2s ease-in-out infinite;
  }
    /* ==================== MONITOR START BUTTON ==================== */
  .monitor-start-wrap{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    padding:24px;z-index:5;
    transition:opacity .35s ease;
  }
  .monitor-start-wrap.hidden{display:none}

  .monitor-start-btn{
    position:relative;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    gap:14px;
    padding:42px 54px;
    border:1.5px solid var(--border);
    border-radius:24px;
    background:rgba(255,255,255,.8);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    font-family:inherit;font-weight:900;font-size:20px;
    color:var(--navy);cursor:pointer;
    transition:transform .25s ease, box-shadow .3s ease, border-color .25s ease;
    box-shadow:0 12px 32px rgba(15,37,87,.12);
  }
  .monitor-start-btn svg{color:var(--blue)}
  .monitor-start-btn:hover{
    transform:translateY(-3px);
    border-color:var(--blue);
    box-shadow:0 20px 44px rgba(59,130,246,.28);
  }
  .monitor-start-btn:active{transform:translateY(0)}
  .monitor-start-btn::before{
    content:"";position:absolute;inset:-3px;border-radius:27px;padding:3px;
    background:conic-gradient(from var(--angle),
      transparent 0deg, transparent 300deg,
      rgba(168,85,247,.75) 335deg, rgba(192,132,252,1) 350deg,
      rgba(168,85,247,.75) 358deg, transparent 360deg);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
    mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    mask-composite:exclude;
    animation:rotateAngle 3s linear infinite;
    pointer-events:none;z-index:1;
  }
  .monitor-start-btn::after{

  .counter-alerts{cursor:default;opacity:.92}

    0%{transform:scale(1)}
    50%{transform:scale(1.18)}
    100%{transform:scale(1)}

  /* Purple glow — all counter boxes */
  .counter-box::before{
    content:"";position:absolute;inset:-2px;border-radius:22px;padding:2px;

      rgba(168,85,247,.7) 358deg, transparent 360deg);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;

  }
  .counter-box::after{

  .grade-modal.active{display:block}

    position:absolute;inset:0;

  .grade-modal-panel::before{
    content:"";position:absolute;inset:-2px;border-radius:24px;padding:2px;

    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;

    mask-composite:exclude;
    animation:rotateAngle 3s linear infinite;
    pointer-events:none;z-index:1;
  }
  .grade-modal-panel::after{
    content:"";position:absolute;inset:-4px;border-radius:26px;

  .grade-modal-title{
    text-align:center;font-size:20px;font-weight:900;color:var(--navy);
  }
  .grade-modal-sub{
    text-align:center;font-size:13px;color:var(--text-soft);font-weight:600;
    margin-bottom:6px;
  }

  .grade-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    overflow-y:auto;
    padding:4px;
    max-height:44vh;
  }
  .grade-grid::-webkit-scrollbar{width:6px}
  .grade-grid::-webkit-scrollbar-thumb{background:var(--blue-light);border-radius:10px}

  .grade-chip{
    padding:12px 8px;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fff;
    font-family:inherit;font-weight:700;font-size:12.5px;

    line-height:1.3;
  }
  .grade-chip:hover{border-color:var(--blue);color:var(--navy)}
  .grade-chip.active{
    background:linear-gradient(135deg,var(--navy),var(--blue));

    box-shadow:0 8px 20px rgba(59,130,246,.3);
  }

  .btn-start-monitor{
    position:relative;
    width:100%;padding:14px;
    border:none;border-radius:12px;
    font-family:inherit;font-weight:800;font-size:15px;

  /* ==================== LIST MODALS ==================== */
  .list-modal{

    mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    mask-composite:exclude;
    animation:rotateAngle 3s linear infinite;
    pointer-events:none;z-index:1;
  }
  .list-modal-panel::after{
    content:"";position:absolute;inset:-4px;border-radius:24px;

    pointer-events:none;z-index:-1;

  .modal-close{
    position:absolute;top:10px;left:10px;z-index:5;

  .list-modal-header{
    display:flex;justify-content:space-between;align-items:center;
    padding:0 4px;
  }
  .list-modal-header h2{font-size:17px;font-weight:900;color:var(--navy)}
  .list-count{
    background:linear-gradient(135deg,var(--navy),var(--blue));
    color:#fff;font-weight:800;font-size:13px;

  }

  .list-search{
    position:relative;
  }

  }

    width:100%;padding:11px 44px 11px 14px;

    border-radius:10px;
    font-family:inherit;font-size:13.5px;color:var(--text);
    outline:none;background:var(--bg-soft);
    transition:border-color .2s ease, box-shadow .2s ease;
  }
  .list-search input:focus{
    border-color:var(--blue);
    background:#fff;
    box-shadow:0 0 0 4px rgba(59,130,246,.12);
  }

  .list-body{
    flex:1;overflow-y:auto;
    display:flex;flex-direction:column;gap:8px;
    padding:4px;
    min-height:200px;max-height:50vh;
  }
  .list-body::-webkit-scrollbar{width:6px}

  .list-actions{
    display:grid;grid-template-columns:1fr 1fr;
    gap:10px;padding-top:6px;
  }
  .btn-alert-all,
  .btn-exit-list{

  .btn-exit-list{

    border:1.5px solid var(--border);
  }
  .btn-exit-list:hover{border-color:var(--blue);color:var(--blue);background:#fff}

  @media (max-width:600px){

    /* ===== Friday Group Selector ===== */

  }
  .group-opt-friday{

/* ============ Remember Me (Encrypted) ============ */
const REMEMBER_KEY = 's7inix_remember_v1';
const REMEMBER_SECRET = 'S7INIX_VAULT_2026';

function saveRemember(uid, email, name){
  try{
    const payload = JSON.stringify({ uid, email, name, at: Date.now() });
    const enc = CryptoJS.AES.encrypt(payload, REMEMBER_SECRET).toString();
    localStorage.setItem(REMEMBER_KEY, enc);
  }catch(e){ console.warn('saveRemember failed', e); }
}

function getRemember(){
  try{
    const enc = localStorage.getItem(REMEMBER_KEY);
    if(!enc) return null;
    const bytes = CryptoJS.AES.decrypt(enc, REMEMBER_SECRET);
    const payload = bytes.toString(CryptoJS.enc.Utf8);
    if(!payload) return null;
    return JSON.parse(payload);
  }catch(e){ return null; }
}

function clearRemember(){
  try{ localStorage.removeItem(REMEMBER_KEY); }catch(e){}
}

signupForm.addEventListener('submit', async (e) => {

/* ============ Auth State ============ */
onAuthStateChanged(auth, async (user) => {
  setLoading(loginBtn, false);
  setLoading(signupBtn, false);

  if(user){
    const saved = getRemember();
    if(!saved || saved.uid !== user.uid){
      saveRemember(user.uid, user.email, user.displayName || '');
    }
    try{
      const ref = doc(db, 'admins', user.uid);
      const snap = await getDoc(ref);
      if(!snap.exists()){
        await setDoc(ref, {
          uid: user.uid,
          email: user.email,
          displayName: user.displayName || '',
          role: 'admin',
          permissions: 'all',
          active: true,
          createdAt: serverTimestamp(),
          lastLogin: serverTimestamp()
        });
      }else{
        await setDoc(ref, { lastLogin: serverTimestamp() }, { merge: true });
      }
    }catch(e){ console.warn('admin doc check failed', e); }

    authScreen.classList.add('hidden');
    dashboard.classList.add('visible');
    bootLoader.classList.add('hidden');

    // 🆕 تحديد اليوزر الحالي
    currentUser = user;

    // 🆕 قراءة حالة المراقبة من Firestore (المصدر الأساسي)
    let remoteMonitoring = null;
    try{
      const adminSnap = await getDoc(doc(db, 'admins', user.uid));
      if(adminSnap.exists()){
        remoteMonitoring = adminSnap.data().monitoringState;
      }
    }catch(e){ console.warn('read monitoring state failed', e); }

    if(remoteMonitoring && remoteMonitoring.active && remoteMonitoring.grade && remoteMonitoring.group){
      monitorStartWrap.classList.add('hidden');
      monitorStartWrap.style.display = 'none';
      monitorPanel.classList.add('active');
      restoreMonitoring(remoteMonitoring);
    } else {
      monitorStartWrap.classList.remove('hidden');
      monitorStartWrap.style.display = '';
      monitorPanel.classList.remove('active');
    }

    // 🆕 الاستماع للتغييرات اللحظية (لو جهاز تاني بدأ أو وقف)
    subscribeMonitoringSync();

  }else{
    // 🆕 تنظيف المراقبة عند تسجيل الخروج
    currentUser = null;
    if(monitoringSyncUnsub){ monitoringSyncUnsub(); monitoringSyncUnsub = null; }
    
    closeSidebar();
    dashboard.classList.remove('visible');
    authScreen.classList.remove('hidden');
    authScreen.scrollTop = 0;
    bootLoader.classList.add('hidden');
  }
});

const DAY_NAMES_AR = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const GROUP_A_DAYS = ['السبت','الاثنين','الأربعاء','الجمعة'];
const GROUP_B_DAYS = ['الأحد','الثلاثاء','الخميس','الجمعة'];
const GROUP_A_NAME = 'السبت - الاثنين - الأربع - الجمعة';
const GROUP_B_NAME = 'الأحد - الثلاثاء - الخميس - الجمعة';

const GRADES_LIST = [
  'الصف الأول الابتدائي','الصف الثاني الابتدائي','الصف الثالث الابتدائي',
  'الصف الرابع الابتدائي','الصف الخامس الابتدائي','الصف السادس الابتدائي',
  'الصف الأول الإعدادي','الصف الثاني الإعدادي','الصف الثالث الإعدادي',
  'الصف الأول الثانوي','الصف الثاني الثانوي','الصف الثالث الثانوي'
];

let monitoringState = {
  active: false,
  grade: null,
  group: null,
  day: null,
  date: null,
  students: [],
  checkins: [],
  unsubscribeStudents: null,
  unsubscribeCheckins: null,
  clockInterval: null
};
let currentUser = null;
let monitoringSyncUnsub = null;

/* ============ Monitoring Persistence ============ */
const MONITOR_STATE_KEY = 's7inix_monitoring_state_v1';

function saveMonitoringState(){
  try{
    localStorage.setItem(MONITOR_STATE_KEY, JSON.stringify({
      active: monitoringState.active,
      grade: monitoringState.grade,
      group: monitoringState.group,
      day: monitoringState.day,
      date: monitoringState.date,
      startedAt: Date.now()
    }));
  }catch(e){ console.warn('saveMonitoringState failed', e); }
}

function loadMonitoringState(){
  try{
    const raw = localStorage.getItem(MONITOR_STATE_KEY);
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){ return null; }
}

function clearMonitoringState(){
  try{ localStorage.removeItem(MONITOR_STATE_KEY); }catch(e){}
}
/* ============ Monitoring Sync (Firestore) ============ */
async function saveMonitoringStateToFirestore(){
  if(!currentUser) return;
  try{
    await setDoc(doc(db, 'admins', currentUser.uid), {
      monitoringState: {
        active: true,
        grade: monitoringState.grade,
        group: monitoringState.group,
        day: monitoringState.day,
        date: monitoringState.date,
        startedAt: serverTimestamp()
      }
    }, { merge: true });
  }catch(e){ console.warn('saveMonitoringStateToFirestore failed', e); }
}

async function clearMonitoringStateFromFirestore(){
  if(!currentUser) return;
  try{
    await setDoc(doc(db, 'admins', currentUser.uid), {
      monitoringState: {
        active: false,
        grade: null,
        group: null,
        day: null,
        date: null,
        startedAt: null
      }
    }, { merge: true });
  }catch(e){ console.warn('clearMonitoringStateFromFirestore failed', e); }
}

function subscribeMonitoringSync(){
  if(!currentUser) return;
  if(monitoringSyncUnsub){ monitoringSyncUnsub(); monitoringSyncUnsub = null; }

  monitoringSyncUnsub = onSnapshot(doc(db, 'admins', currentUser.uid), (snap) => {
    if(!snap.exists()) return;
    const remote = snap.data().monitoringState;
    if(!remote) return;

    // 1. لو الريموت نشط، وإحنا مش نشطين → نسترجع
    if(remote.active && !monitoringState.active && remote.grade && remote.group){
      monitorStartWrap.classList.add('hidden');
      monitorStartWrap.style.display = 'none';
      monitorPanel.classList.add('active');
      restoreMonitoring(remote);
    }
    // 2. لو الريموت متوقف، وإحنا نشطين → نوقف
    else if(!remote.active && monitoringState.active){
      stopMonitoring();
    }
  }, (err) => console.warn('monitoring sync error', err));
}
/* ---- Helpers ---- */
function getTodayStr(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function getTodayName(){
  return DAY_NAMES_AR[new Date().getDay()];
}
function getTodayGroup(){
  const name = getTodayName();
  if(name === 'الجمعة') return null; // الجمعة → المستخدم يختار
  if(GROUP_A_DAYS.includes(name)) return GROUP_A_NAME;
  if(GROUP_B_DAYS.includes(name)) return GROUP_B_NAME;
  return null;
}
function formatDateAr(d){
  return d.toLocaleDateString('ar-EG', { year:'numeric', month:'long', day:'numeric' });
}
function escapeHtmlMon(str){
  return String(str ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function setCounterValue(el, newVal){

  el.textContent = newVal;
  if(cur !== newVal){
    el.classList.remove('pulse');

    el.classList.add('pulse');

}

  gradeGrid.querySelectorAll('.grade-chip').forEach(x => x.classList.remove('active'));

  const fridaySel = document.getElementById('groupSelectFriday');
  fridaySel.querySelectorAll('.group-opt-friday').forEach(b => b.classList.remove('active'));

  if(isFriday()){
    fridaySel.style.display = 'flex';
  } else {
    fridaySel.style.display = 'none';
    if(!getTodayGroup()){
      Swal.fire({
        icon:'info',
        title:'لا توجد مجموعة اليوم',
        confirmButtonColor:'#0F2557'
      });
      return;
    }
  }

  gradeModal.classList.add('active');
});

/* Friday group buttons */
document.querySelectorAll('.group-opt-friday').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.group-opt-friday').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedFridayGroup = btn.dataset.group === 'A' ? GROUP_A_NAME : GROUP_B_NAME;
  });
});

gradeModalOverlay.addEventListener('click', () => {
  gradeModal.classList.remove('active');
});

/* ---- Start Monitoring ---- */
startMonitorBtn.addEventListener('click', async () => {
  if(!selectedGrade){
    Swal.fire({ icon:'warning', title:'اختر الصف أولاً', confirmButtonColor:'#0F2557' });
    return;
  }

  let todayGroup;
  if(isFriday()){
    if(!selectedFridayGroup){
      Swal.fire({ icon:'warning', title:'اختر المجموعة أولاً', confirmButtonColor:'#0F2557' });
      return;
    }
    todayGroup = selectedFridayGroup;
  } else {
    todayGroup = getTodayGroup();
    if(!todayGroup){
      Swal.fire({ icon:'error', title:'لا توجد مجموعة اليوم', confirmButtonColor:'#0F2557' });
      return;
    }
  }

  startMonitorBtn.classList.add('loading');
  startMonitorBtn.disabled = true;

  try{
    monitoringState.active = true;
    monitoringState.grade = selectedGrade;
    monitoringState.group = todayGroup;
    monitoringState.day = getTodayName();
    monitoringState.date = getTodayStr();
    monitoringState.students = [];
    monitoringState.checkins = [];

    // Update UI
    document.getElementById('monitorGradeTitle').textContent = selectedGrade;
    document.getElementById('monitorSubtitle').textContent = `${todayGroup} — ${monitoringState.day}`;
    document.getElementById('monitorDate').textContent = formatDateAr(new Date());

    // Hide start, show panel
    gradeModal.classList.remove('active');
    monitorStartWrap.classList.add('hidden');
    monitorStartWrap.style.display = 'none';   // 🆕 حماية إضافية
    monitorPanel.classList.add('active');

    // Start clock
    startClock();

    // Subscribe to students
    const studentsRef = collection(db, 'students');
    monitoringState.unsubscribeStudents = onSnapshot(studentsRef, (snap) => {
      monitoringState.students = snap.docs.map(d => ({ _id: d.id, ...d.data() }))
        .filter(s => s.group === todayGroup && s.grade === selectedGrade);
      recalcCounters();
    }, (err) => console.warn('students listener error', err));

    // Subscribe to checkins for today
    const todayStr = getTodayStr();
    const checkinsQuery = query(collection(db, 'checkins'), where('date', '==', todayStr));
    monitoringState.unsubscribeCheckins = onSnapshot(checkinsQuery, (snap) => {
      monitoringState.checkins = snap.docs.map(d => ({ _id: d.id, ...d.data() }))
        .filter(c => c.group === todayGroup && c.grade === selectedGrade);
      recalcCounters();
    }, (err) => console.warn('checkins listener error', err));
    
    // 🆕 حفظ في localStorage و Firestore
    saveMonitoringState();
    await saveMonitoringStateToFirestore();
  }catch(err){
    console.error(err);
    Swal.fire({ icon:'error', title:'فشل بدء المراقبة', text:err.message, confirmButtonColor:'#0F2557' });
  }finally{
    startMonitorBtn.classList.remove('loading');
    startMonitorBtn.disabled = false;
  }
});
/* ---- Restore Monitoring from localStorage ---- */
async function restoreMonitoring(saved){
  try{
    // 1) استرجاع الحالة
    monitoringState.active = true;
    monitoringState.grade = saved.grade;
    monitoringState.group = saved.group;
    monitoringState.day = saved.day;
    monitoringState.date = saved.date;
    monitoringState.students = [];
    monitoringState.checkins = [];

    // 2) تحديث الـ UI
    document.getElementById('monitorGradeTitle').textContent = saved.grade;
    document.getElementById('monitorSubtitle').textContent = `${saved.group} — ${saved.day}`;
    document.getElementById('monitorDate').textContent = formatDateAr(new Date());

    monitorStartWrap.classList.add('hidden');
    monitorPanel.classList.add('active');

    startClock();

    // 3) الاشتراك في students
    const studentsRef = collection(db, 'students');
    monitoringState.unsubscribeStudents = onSnapshot(studentsRef, (snap) => {
      monitoringState.students = snap.docs.map(d => ({ _id: d.id, ...d.data() }))
        .filter(s => s.group === saved.group && s.grade === saved.grade);
      recalcCounters();
    }, (err) => console.warn('students listener error', err));

    // 4) الاشتراك في checkins (بتاريخ المراقبة المحفوظ)
    const checkinsQuery = query(collection(db, 'checkins'), where('date', '==', saved.date));
    monitoringState.unsubscribeCheckins = onSnapshot(checkinsQuery, (snap) => {
      monitoringState.checkins = snap.docs.map(d => ({ _id: d.id, ...d.data() }))
        .filter(c => c.group === saved.group && c.grade === saved.grade);
      recalcCounters();
    }, (err) => console.warn('checkins listener error', err));

  }catch(e){
    console.warn('restoreMonitoring failed', e);
    clearMonitoringState();
  }
}
/* ---- Clock ---- */
function startClock(){
  stopClock();
  const tick = () => {
    const now = new Date();
    const el = document.getElementById('monitorClock');
    if(el) {
      // 🆕 عرض الوقت بنظام 12 ساعة مع ص/م
      el.textContent = now.toLocaleTimeString('ar-EG', { 
        hour: '2-digit', 
        minute: '2-digit', 
        second: '2-digit', 
        hour12: true 
      });
    }
  };
  tick();
  monitoringState.clockInterval = setInterval(tick, 1000);
}
function stopClock(){
  if(monitoringState.clockInterval){
    clearInterval(monitoringState.clockInterval);
    monitoringState.clockInterval = null;
  }
}

/* ---- Counters ---- */
function recalcCounters(){
  const present = monitoringState.checkins;
  const presentIds = new Set(present.map(c => c.studentDocId));
  const absent = monitoringState.students.filter(s => !presentIds.has(s._id));

  setCounterValue(document.getElementById('countAttendance'), present.length);
  setCounterValue(document.getElementById('countAbsence'), absent.length);
  // Alerts = 0 مؤقتاً
}

/* ---- Exit Monitoring ---- */
monitorExitBtn.addEventListener('click', async () => {
  const res = await Swal.fire({
    title: 'إيقاف المراقبة؟',
    text: 'سيتم إغلاق لوحة المراقبة الحالية',
    icon: 'question',
    showCancelButton: true,
    confirmButtonText: 'إيقاف',
    cancelButtonText: 'إلغاء',
    confirmButtonColor: '#DC2626',
    cancelButtonColor: '#5A6B8C',
    reverseButtons: true
  });
  if(!res.isConfirmed) return;
  stopMonitoring();
});

function stopMonitoring(){
  monitoringState.active = false;
  clearMonitoringState();
  clearMonitoringStateFromFirestore(); // 🆕
  stopClock();
  if(monitoringState.unsubscribeStudents){ monitoringState.unsubscribeStudents(); monitoringState.unsubscribeStudents = null; }
  if(monitoringState.unsubscribeCheckins){ monitoringState.unsubscribeCheckins(); monitoringState.unsubscribeCheckins = null; }
  monitoringState.students = [];
  monitoringState.checkins = [];
  monitorPanel.classList.remove('active');
  monitorStartWrap.classList.remove('hidden');
  monitorStartWrap.style.display = '';   // 🆕
  document.getElementById('countAttendance').textContent = '0';
  document.getElementById('countAbsence').textContent = '0';
  document.getElementById('countAlerts').textContent = '0';
}

/* ==================== ATTENDANCE / ABSENCE MODALS ==================== */
const absenceModal = document.getElementById('absenceModal');
const attendanceModal = document.getElementById('attendanceModal');
const absenceList = document.getElementById('absenceList');
const attendanceList = document.getElementById('attendanceList');
const absenceSearchInput = document.getElementById('absenceSearch');
const attendanceSearchInput = document.getElementById('attendanceSearch');

let absenceQueryStr = '';
let attendanceQueryStr = '';

function getAbsentStudents(){
  const presentIds = new Set(monitoringState.checkins.map(c => c.studentDocId));
  return monitoringState.students.filter(s => !presentIds.has(s._id));
}
function getPresentStudents(){
  return monitoringState.checkins.slice();
}

function renderAbsenceList(){
  const q = absenceQueryStr.trim().toLowerCase();
  let list = getAbsentStudents();
  if(q){
    list = list.filter(s =>
      (s.name||'').toLowerCase().includes(q) ||
      (s.studentId||'').toLowerCase().includes(q)
    );
  }
  list.sort((a,b) => (a.name||'').localeCompare(b.name||'','ar'));

  document.getElementById('absenceCount').textContent = list.length;

  if(list.length === 0){
    absenceList.innerHTML = `
      <div class="list-empty">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
          <polyline points="22 4 12 14.01 9 11.01"/>
        </svg>
        <p>${q ? 'لا توجد نتائج' : 'لا يوجد غياب — كل الطلاب حاضرين 🎉'}</p>
      </div>`;
    return;
  }

  absenceList.innerHTML = list.map(s => `
    <div class="student-row absent">
      <div class="student-row-avatar">${escapeHtmlMon((s.name||'؟').charAt(0))}</div>
      <div class="student-row-body">
        <div class="student-row-name">${escapeHtmlMon(s.name||'—')}</div>
        <div class="student-row-id">${escapeHtmlMon(s.studentId||'—')}</div>
        <div class="student-row-grade">${escapeHtmlMon(s.grade||'—')}</div>
      </div>
    </div>
  `).join('');
}

function renderAttendanceList(){
  const q = attendanceQueryStr.trim().toLowerCase();
  let list = getPresentStudents();
  if(q){
    list = list.filter(c =>
      (c.name||'').toLowerCase().includes(q) ||
      (c.studentId||'').toLowerCase().includes(q)
    );
  }
  list.sort((a,b) => {
    const ta = a.checkedInAt?.toDate ? a.checkedInAt.toDate().getTime() : 0;
    const tb = b.checkedInAt?.toDate ? b.checkedInAt.toDate().getTime() : 0;
    return ta - tb;
  });

  document.getElementById('attendanceCount').textContent = list.length;

  if(list.length === 0){
    attendanceList.innerHTML = `
      <div class="list-empty">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <polyline points="12 6 12 12 16 14"/>
        </svg>
        <p>${q ? 'لا توجد نتائج' : 'لسه مفيش حضور مسجل'}</p>
      </div>`;
    return;
  }

  attendanceList.innerHTML = list.map(c => {
    let timeStr = '—';
    try{
      if(c.checkedInAt?.toDate){
        const d = c.checkedInAt.toDate();
        // 🆕 عرض الوقت بنظام 12 ساعة
        timeStr = d.toLocaleTimeString('ar-EG', { 
          hour: '2-digit', 
          minute: '2-digit', 
          second: '2-digit', 
          hour12: true 
        });
      }
    }catch(_){}
    return `
      <div class="student-row present">
        <div class="student-row-avatar">${escapeHtmlMon((c.name||'؟').charAt(0))}</div>
        <div class="student-row-body">
          <div class="student-row-name">${escapeHtmlMon(c.name||'—')}</div>
          <div class="student-row-id">${escapeHtmlMon(c.studentId||'—')}</div>
          <div class="student-row-grade">${escapeHtmlMon(c.grade||'—')}</div>
        </div>
        <div class="student-row-time">${timeStr}</div>
      </div>
    `;
  }).join('');
}

/* ---- Counter Boxes click ---- */
document.querySelectorAll('.counter-box').forEach(box => {
  const target = box.dataset.target;
  if(!target) return; // alerts (no click)
  box.addEventListener('click', () => {
    if(target === 'attendance'){
      attendanceQueryStr = '';
      attendanceSearchInput.value = '';
      renderAttendanceList();
      attendanceModal.classList.add('active');
    }else if(target === 'absence'){
      absenceQueryStr = '';
      absenceSearchInput.value = '';
      renderAbsenceList();
      absenceModal.classList.add('active');
    }
  });
});

/* ---- Search ---- */
absenceSearchInput.addEventListener('input', (e) => {
  absenceQueryStr = e.target.value;
  renderAbsenceList();
});
attendanceSearchInput.addEventListener('input', (e) => {
  attendanceQueryStr = e.target.value;
  renderAttendanceList();
});

/* ---- Absence modal buttons ---- */
document.getElementById('absenceExitBtn').addEventListener('click', () => {
  absenceModal.classList.remove('active');
});
document.getElementById('alertAllBtn').addEventListener('click', async () => {
  const absent = getAbsentStudents();

  // 🆕 لو مفيش طلاب غائبين → مفيش إنذار
  if(absent.length === 0){
    Swal.fire({
      icon:'info',
      title:'لا يوجد طلاب غائبين',
      text:'كل الطلاب حاضرين بالفعل ✅',
      confirmButtonColor:'#10B981'
    });
    return;
  }

  // تأكيد قبل الإرسال
  const confirm = await Swal.fire({
    title: 'تفعيل إنذار للكل؟',
    html: `سيتم إرسال إنذار إلى <strong style="color:#7C3AED">${absent.length}</strong> طالب غائب`,
    icon: 'warning',
    showCancelButton: true,
    confirmButtonText: 'تفعيل',
    cancelButtonText: 'إلغاء',
    confirmButtonColor: '#7C3AED',
    cancelButtonColor: '#5A6B8C',
    reverseButtons: true
  });

  if(!confirm.isConfirmed) return;

  absenceModal.classList.remove('active');
  Swal.fire({
    icon:'info',
    title:'الإنذارات قريباً',
    text:'سيتم تفعيل نظام الإنذارات في تحديث قادم',
    confirmButtonColor:'#7C3AED'
  });
});

/* Absence modal: NO outside-click close, NO Escape close */

document.getElementById('attendanceClose').addEventListener('click', () => {

});
document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape' && attendanceModal.classList.contains('active')){
    attendanceModal.classList.remove('active');
  }
});
